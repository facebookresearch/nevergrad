name: facebookresearch/nevergrad/main
on:
  push:
    branches:
      - main
jobs:
  docs-links:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) cannot build IOHexperimenter 0.2.x
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4.1.0
      - uses: "./.github/actions/ubuntu_restore_all"
      - name: Check links
        run: |
          . venv/bin/activate
          cd docs/
          make linkcheck
